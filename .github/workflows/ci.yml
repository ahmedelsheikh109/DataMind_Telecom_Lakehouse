name: Telecom Lakehouse CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    name: Code Quality & Schema Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Environment Template
      run: |
        test -f .env.example || exit 1
        echo "Environment template verified."

    - name: Validate Python Syntax
      run: |
        python -m compileall ai_assistant/ run_multi_agent_live_audit.py
